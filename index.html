<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой ритм</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#f5f5f2;--card:#fff;--text:#20211f;--muted:#777;--line:#e4e4df;--accent:#2f6f57;--soft:#e9f1ed}
@media(prefers-color-scheme:dark){:root{--bg:#151715;--card:#202320;--text:#f1f2ef;--muted:#aaa;--line:#353935;--accent:#82c4a5;--soft:#25352d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}#app{min-height:100vh;background:var(--bg)}
header{padding:24px 18px 12px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);z-index:2}h1{font-size:28px;margin:0 0 4px} .date{color:var(--muted);font-size:14px}
main{padding:8px 16px 94px;max-width:720px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.title{font-size:18px;font-weight:700;margin-bottom:12px}.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row input{width:21px;height:21px;accent-color:var(--accent)}.small{font-size:13px;color:var(--muted)}.pill{display:inline-block;background:var(--soft);color:var(--accent);padding:6px 9px;border-radius:999px;font-size:13px;font-weight:650}.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0}.bar{height:100%;background:var(--accent);width:0%;transition:.2s}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--soft);border-radius:14px;padding:13px}.stat b{display:block;font-size:21px}.note{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text);padding:11px;font:inherit}.tabs{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:3}.tabs button{border:0;background:none;color:var(--muted);padding:10px 7px 11px;font-size:11px;flex:1;max-width:120px}.tabs button.active{color:var(--accent);font-weight:700}.icon{font-size:19px;display:block;margin-bottom:2px}.hidden{display:none}.section-note{margin-top:16px}.day{display:flex;justify-content:space-between;align-items:center}.week{display:flex;gap:6px;margin-top:12px}.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:12px}.dot.done{background:var(--accent);color:white}.action{border:0;border-radius:12px;padding:9px 12px;background:var(--soft);color:var(--accent);font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:38px;font:inherit;font-size:14px;font-weight:650;line-height:1.2;box-sizing:border-box}

.stat-link{width:100%;border:0;text-align:left;color:var(--text);font:inherit;cursor:pointer;transition:transform .12s,filter .12s}.stat-link:active{transform:scale(.97)}.stat-link:focus-visible,.calendar-day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.calendar-head .title{margin:0}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}.calendar-weekday{font-size:12px;color:var(--muted);padding:5px 0}.calendar-day{border:1px solid transparent;border-radius:10px;min-height:42px;background:var(--soft);color:var(--text);font:inherit;cursor:pointer;position:relative}.calendar-day:disabled{opacity:.25;cursor:default}.calendar-day.empty{visibility:hidden}.calendar-day.selected{border:2px solid var(--accent);font-weight:700}.calendar-day.has-data:after{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:3px;left:calc(50% - 2.5px)}.calendar-day.workout{background:var(--accent);color:var(--card)}.calendar-day.workout:after{background:currentColor}.readonly-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.readonly-row:last-child{border:0}.history-note{white-space:pre-wrap;overflow-wrap:anywhere}
.stats-switch{display:flex;gap:6px;margin:12px 0}.stats-switch button{flex:1}.stats-switch button.active{background:var(--accent);color:var(--card)}.chart-row{display:flex;align-items:end;gap:5px;height:95px;margin:14px 0 8px}.chart-column{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:5px}.chart-bar{width:100%;max-width:28px;min-height:3px;background:var(--accent);border-radius:5px 5px 2px 2px}.chart-label{font-size:10px;color:var(--muted);white-space:nowrap}.chart-empty{color:var(--muted);font-size:13px}
</style></head>
<body><div id="app"><header><h1>Мой ритм</h1><div class="date">Сегодня · понедельник</div></header><main id="main"></main><nav class="tabs" id="tabs"></nav></div>
<script>
const STORE='my-rhythm-days-v1';

// v0.6 / шаг 1: декларативный каталог. Пока только описание,
// существующие обработчики, ключи localStorage и резервные копии не меняются.
// Системные разделы не содержат пользовательских чекбоксов.
const SECTION_CATALOG = Object.freeze([
  {id:'today',title:'Сегодня',icon:'◷',kind:'system',order:0},
  {id:'sport',title:'Спорт',icon:'♢',kind:'editable',order:1},
  {id:'food',title:'Питание',icon:'⌁',kind:'editable',order:2},
  {id:'habits',title:'Привычки',icon:'✓',kind:'editable',order:3},
  {id:'history',title:'История',icon:'↻',kind:'system',order:4}
]);
// id — будущий постоянный идентификатор; legacyKey — ключ отметок v0.5.
// Отдельный id позволяет позже менять название и порядок без потери истории.
const ITEM_CATALOG = Object.freeze([
  {id:'sport.row',sectionId:'sport',legacyKey:'w0',title:'Тяга на тренажёре на спину — 3 × 10–12',group:'workout',order:0},
  {id:'sport.press',sectionId:'sport',legacyKey:'w1',title:'Жим от груди на тренажёре — 3 × 10–12',group:'workout',order:1},
  {id:'sport.pullups',sectionId:'sport',legacyKey:'w2',title:'Подтягивания на низком турнике / австралийские — 3 × 5–8',group:'workout',order:2},
  {id:'sport.dips',sectionId:'sport',legacyKey:'w3',title:'Отжимания на брусьях — 3 × 6–9',group:'workout',order:3},
  {id:'sport.crunches',sectionId:'sport',legacyKey:'w4',title:'Скручивания на пресс — 3 × 12–15',group:'workout',order:4},
  {id:'sport.workout-complete',sectionId:'sport',legacyKey:'workoutDone',title:'Тренировка завершена',group:'completion',order:5},
  {id:'sport.qigong',sectionId:'sport',legacyKey:'daily0',title:'Цигун — 25–30 минут',group:'daily',order:0},
  {id:'sport.knee-claps',sectionId:'sport',legacyKey:'daily1',title:'Шлепки под коленом — 50',group:'short',order:0},
  {id:'sport.knee-elbow',sectionId:'sport',legacyKey:'daily2',title:'Колено к локтю в сторону — 50',group:'short',order:1},
  {id:'sport.squats',sectionId:'sport',legacyKey:'daily3',title:'Приседания — 50',group:'short',order:2},
  {id:'food.breakfast',sectionId:'food',legacyKey:'meal0',title:'10:00 — Завтрак',group:'meals',order:0},
  {id:'food.lunch',sectionId:'food',legacyKey:'meal1',title:'13:00 — Обед',group:'meals',order:1},
  {id:'food.snack',sectionId:'food',legacyKey:'meal2',title:'15:00 — Перекус',group:'meals',order:2},
  {id:'food.dinner',sectionId:'food',legacyKey:'meal3',title:'18:00 — Ужин',group:'meals',order:3},
  {id:'food.mindful',sectionId:'food',legacyKey:'mindful',title:'Есть осознанно',group:'mindfulness',order:0},
  {id:'habits.creative',sectionId:'habits',legacyKey:'creative',title:'Творчество / Рисование — минимум 10 минут',group:'habits',order:0}
]);

// v0.6 / шаг 2: постоянные ID элементов и совместимость с историческими ключами.
// В этом шаге данные по-прежнему записываются под legacyKey; миграции нет.
const ITEM_BY_ID = new Map(ITEM_CATALOG.map(item => [item.id, item]));
const ITEM_BY_LEGACY_KEY = new Map(ITEM_CATALOG.map(item => [item.legacyKey, item]));
function assertCatalogIntegrity(){
  if(ITEM_BY_ID.size!==ITEM_CATALOG.length || ITEM_BY_LEGACY_KEY.size!==ITEM_CATALOG.length)
    throw Error('Повторяющиеся идентификаторы элементов.');
  const sections=new Set(SECTION_CATALOG.map(section=>section.id));
  if(sections.size!==SECTION_CATALOG.length)throw Error('Повторяющиеся идентификаторы разделов.');
  for(const item of ITEM_CATALOG){
    if(!sections.has(item.sectionId))throw Error('Неизвестный раздел: '+item.sectionId);
  }
}
assertCatalogIntegrity();
function itemIdForLegacyKey(key){return ITEM_BY_LEGACY_KEY.get(key)?.id ?? null}
function legacyKeyForItemId(id){return ITEM_BY_ID.get(id)?.legacyKey ?? null}
function itemById(id){return ITEM_BY_ID.get(id) ?? null}

const state={tab:'today',selected:dateKey(new Date()),month:dateKey(new Date()).slice(0,7),days:loadDays(),statsPeriod:7};
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDay(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function shiftDay(k,n){const d=parseDay(k);d.setDate(d.getDate()+n);return dateKey(d)}
function loadDays(){try{const obj=JSON.parse(localStorage.getItem(STORE)||'{}');return obj&&typeof obj==='object'&&!Array.isArray(obj)?obj:{}}catch{return {}}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state.days))}catch{alert('Не удалось сохранить данные. Проверьте настройки браузера и свободное место.')}}
function record(k=state.selected){return state.days[k]||{checks:{},note:''}}
function editRecord(){return state.days[state.selected]??={checks:{},note:''}}
function doneWorkout(k){return !!record(k).checks[itemById('sport.workout-complete').legacyKey]}
function weekStart(k){const d=parseDay(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dateKey(d)}
function weekCount(k){let start=weekStart(k),n=0;for(let i=0;i<7;i++)if(doneWorkout(shiftDay(start,i)))n++;return n}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectDay(k){if(!validDateKey(k)||k>dateKey(new Date()))return;state.selected=k;state.month=k.slice(0,7);state.tab='history';render()}
function navigate(tab){state.tab=tab;if(tab!=='history')state.selected=dateKey(new Date());render()}
function updateNote(v){editRecord().note=v;save()}
function syncDay(){const now=dateKey(new Date());if(now!==lastToday){if(state.selected===lastToday){state.selected=now;state.month=now.slice(0,7)}lastToday=now;render()}}
let lastToday=dateKey(new Date());

// v0.6 / шаг 3: каталог становится единым источником отображаемых пунктов.
// legacyKey сохраняется без изменений, поэтому миграция данных не требуется.
function sectionItems(sectionId,group){return ITEM_CATALOG.filter(item=>item.sectionId===sectionId&&(group===undefined||item.group===group)).sort((a,b)=>a.order-b.order)}
function itemWithKey(key){const item=ITEM_BY_LEGACY_KEY.get(key);if(!item)throw Error('Неизвестный ключ: '+key);return item}
function itemChecked(item,k=state.selected){return !!record(k).checks[item.legacyKey]}
function groupComplete(sectionId,group,k){const items=sectionItems(sectionId,group);return items.length>0&&items.every(item=>itemChecked(item,k))}
function itemBox(item){return box(item.legacyKey,item.title)}
function groupBoxes(sectionId,group){return sectionItems(sectionId,group).map(itemBox).join('')}

function checked(k){return !!record().checks[k]}
function toggleItem(id){
  const key=legacyKeyForItemId(id);
  if(!key)throw Error('Неизвестный элемент: '+id);
  const r=editRecord();r.checks[key]=!r.checks[key];save();render();
}
// Сохранён для совместимости со старым интерфейсом и существующими вызовами.
function toggle(k){const id=itemIdForLegacyKey(k);if(!id)throw Error('Неизвестный ключ: '+k);toggleItem(id)}
function box(k,label){const id=itemIdForLegacyKey(k);if(!id)throw Error('Неизвестный ключ: '+k);return `<label class="row"><input type="checkbox" ${checked(k)?'checked':''} onchange="toggleItem('${id}')"><span>${label}</span></label>`}
function note(){return `<div class="card section-note"><div class="title">Заметка дня</div><textarea class="note" placeholder="Что важно отметить сегодня?" oninput="updateNote(this.value)">${escapeHtml(record().note)}</textarea></div>`}
function progress(){const items=[...sectionItems('sport','daily'),...sectionItems('sport','short'),...sectionItems('food','meals'),...sectionItems('habits','habits')];return Math.round(items.filter(item=>itemChecked(item)).length/items.length*100)}
function today(){let sport=weekCount(state.selected);return `<div class="card"><div class="title">Сегодня</div><div class="grid"><button type="button" class="stat stat-link" onclick="navigate('sport')"><span class="small">Спорт</span><b>${sport}/3</b><span class="small">тренировок за неделю</span></button><button type="button" class="stat stat-link" onclick="navigate('food')"><span class="small">Питание</span><b>${sectionItems('food','meals').filter(item=>itemChecked(item)).length}/${sectionItems('food','meals').length}</b><span class="small">приёмов пищи</span></button><button type="button" class="stat stat-link" onclick="navigate('habits')"><span class="small">Привычка</span><b>${sectionItems('habits','habits').some(item=>itemChecked(item))?'✓':'—'}</b><span class="small">рисование</span></button><button type="button" class="stat stat-link" onclick="navigate('history')"><span class="small">Общий ориентир</span><b>${progress()}%</b><span class="small">без гонки за 100%</span></button></div><div class="progress"><div class="bar" style="width:${progress()}%"></div></div></div><div class="card"><div class="title">Сегодня достаточно</div><div class="small">Не обязательно закрывать всё. Главное — удерживать ритм и возвращаться к нему.</div></div>${note()}`}
function sport(){const exerciseItems=sectionItems('sport','workout');return `<div class="card"><div class="day"><div><div class="title">Основная тренировка</div><div class="small">3 раза в неделю · 25–30 минут</div></div><span class="pill">${exerciseItems.filter(item=>itemChecked(item)).length}/${exerciseItems.length}</span></div>${groupBoxes('sport','workout')}<div style="margin-top:12px;padding-top:10px;border-top:2px solid var(--line)">${groupBoxes('sport','completion')}</div></div><div class="card"><div class="title">Ежедневно</div>${groupBoxes('sport','daily')}</div><div class="card"><div class="title">Короткий блок</div>${groupBoxes('sport','short')}</div>${note()}`}
function food(){return `<div class="card"><div class="title">Питание</div>${groupBoxes('food','meals')}</div><div class="card"><div class="title">Осознанность</div>${groupBoxes('food','mindfulness')}</div><div class="card"><div class="title">Принцип</div><div class="small">Регулярность важнее идеальности. Минимум 3 часа между приёмами пищи.</div></div>${note()}`}
function habits(){return `<div class="card"><div class="title">Привычки</div>${groupBoxes('habits','habits')}</div>${note()}`}
function changeMonth(delta){const [y,m]=state.month.split('-').map(Number);const d=new Date(y,m-1+delta,1);const target=dateKey(d).slice(0,7);if(target>dateKey(new Date()).slice(0,7))return;state.month=target;render()}
function calendar(){const [year,month]=state.month.split('-').map(Number);const first=new Date(year,month-1,1);const offset=(first.getDay()+6)%7;const length=new Date(year,month,0).getDate();const now=dateKey(new Date());let cells=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<span class="calendar-weekday">${d}</span>`);for(let i=0;i<offset;i++)cells.push('<span></span>');for(let day=1;day<=length;day++){const k=`${state.month}-${String(day).padStart(2,'0')}`;const future=k>now;cells.push(`<button type="button" class="calendar-day ${k===state.selected?'selected':''} ${Object.hasOwn(state.days,k)?'has-data':''} ${doneWorkout(k)?'workout':''}" ${future?'disabled':''} onclick="selectDay('${k}')" aria-label="${k}">${day}</button>`)}return `<div class="card"><div class="calendar-head"><button class="action" onclick="changeMonth(-1)" aria-label="Предыдущий месяц">‹</button><div class="title">${first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</div><button class="action" onclick="changeMonth(1)" ${state.month>=now.slice(0,7)?'disabled':''} aria-label="Следующий месяц">›</button></div><div class="calendar-grid">${cells.join('')}</div><div class="small" style="margin-top:12px">Точка — есть запись. Зелёный день — выполнена основная тренировка.</div></div>`}
function readonlyDay(k){const r=record(k);const keys=[...sectionItems('sport','workout'),...sectionItems('sport','daily'),...sectionItems('sport','short'),...sectionItems('food','meals'),...sectionItems('sport','completion'),...sectionItems('food','mindfulness'),...sectionItems('habits','habits')].map(item=>[item.legacyKey,item.title]);return `<div class="card"><div class="title">${parseDay(k).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</div>${Object.hasOwn(state.days,k)?keys.map(([key,label])=>`<div class="readonly-row"><span>${escapeHtml(label)}</span><b>${r.checks[key]?'✓':'—'}</b></div>`).join('')+'<div class="title" style="margin-top:16px">Заметка дня</div><div class="small history-note">'+(r.note?escapeHtml(r.note):'Нет заметки')+'</div>':'<div class="small">За этот день пока нет записей.</div>'}</div>`}
function foodDone(k){return groupComplete('food','meals',k)&&groupComplete('food','mindfulness',k)}
function creativeDone(k){return groupComplete('habits','habits',k)}
function statsPeriod(n){state.statsPeriod=n;render()}
function statChart(title,dates,metric,total,subtitle){const n=dates.length;const step=n===30?5:1;const bars=dates.map((k,i)=>{const value=metric(k)?1:0;const label=(n===7||i%step===0||i===n-1)?String(parseDay(k).getDate()):'·';return `<div class="chart-column" title="${k}: ${value?'да':'нет'}"><div class="chart-bar" style="height:${value?68:3}px;${value?'':'opacity:.2'}"></div><span class="chart-label">${label}</span></div>`}).join('');return `<div class="card"><div class="day"><div class="title">${title}</div><span class="pill">${total}</span></div><div class="small">${subtitle}</div><div class="chart-row" role="img" aria-label="${title}: ${total} за ${n} дней">${bars}</div></div>`}
function statistics(){const n=state.statsPeriod,now=dateKey(new Date()),dates=Array.from({length:n},(_,i)=>shiftDay(now,i-n+1));const workoutsDone=dates.filter(doneWorkout).length,foodDays=dates.filter(foodDone).length,creativeDays=dates.filter(creativeDone).length;return `<div class="card"><div class="title">Статистика</div><div class="small">За последние ${n} дней, включая сегодня</div><div class="stats-switch"><button class="action ${n===7?'active':''}" onclick="statsPeriod(7)">7 дней</button><button class="action ${n===30?'active':''}" onclick="statsPeriod(30)">30 дней</button></div></div>`+statChart('Спорт',dates,doneWorkout,workoutsDone+' тренировок','Цель — 3 тренировки в неделю · по отметке завершения')+statChart('Питание',dates,foodDone,Math.round(foodDays/n*100)+'% · '+foodDays+'/'+n+' дней','Все 4 приёма пищи и осознанное питание')+statChart('Творчество',dates,creativeDone,creativeDays+'/'+n+' дней','Рисование не менее 10 минут')}
function history(){const start=weekStart(state.selected),count=weekCount(state.selected);return calendar()+statistics()+`<div class="card"><div class="title">Спорт за неделю · ${escapeHtml(start)}</div><div class="day"><span>Основных тренировок</span><b>${count}/3</b></div><div class="progress"><div class="bar" style="width:${Math.min(100,count/3*100)}%"></div></div></div>`+readonlyDay(state.selected)+backupControls()}


const BACKUP_FORMAT='my-rhythm-backup';
const BACKUP_VERSION=1;
const MAX_BACKUP_BYTES=5*1024*1024;
const CHECK_KEYS=new Set(ITEM_CATALOG.map(item=>item.legacyKey));
function validDateKey(k){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return false;
  const d=parseDay(k);
  return !Number.isNaN(d.getTime())&&dateKey(d)===k;
}
function validatedDays(value){
  if(!value||typeof value!=='object'||Array.isArray(value))throw Error('Некорректный список дней.');
  const cleaned=Object.create(null);
  const entries=Object.entries(value);
  if(entries.length>20000)throw Error('Слишком много записей.');
  for(const [date,entry] of entries){
    if(!validDateKey(date)||!entry||typeof entry!=='object'||Array.isArray(entry))throw Error('Некорректная дата или запись.');
    if(typeof entry.note!=='string'||entry.note.length>100000||!entry.checks||typeof entry.checks!=='object'||Array.isArray(entry.checks))throw Error('Некорректные данные дня '+date);
    const checks={};
    for(const [key,val] of Object.entries(entry.checks)){
      if(!CHECK_KEYS.has(key)||typeof val!=='boolean')throw Error('Некорректная отметка за '+date);
      checks[key]=val;
    }
    cleaned[date]={checks,note:entry.note};
  }
  return cleaned;
}
function exportBackup(){
  try{
    const days=validatedDays(state.days);
    const payload={format:BACKUP_FORMAT,version:BACKUP_VERSION,exportedAt:new Date().toISOString(),days};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='my-rhythm-backup-'+dateKey(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
  }catch(e){alert('Не удалось создать резервную копию: '+e.message)}
}
async function importBackup(input){
  const file=input.files&&input.files[0];input.value='';
  if(!file)return;
  try{
    if(file.size>MAX_BACKUP_BYTES)throw Error('Файл больше 5 МБ.');
    const payload=JSON.parse(await file.text());
    if(!payload||payload.format!==BACKUP_FORMAT||payload.version!==BACKUP_VERSION)throw Error('Это не резервная копия My Rhythm поддерживаемой версии.');
    const incoming=validatedDays(payload.days);
    const current=validatedDays(state.days);
    const existing=new Set(Object.keys(current));
    const dates=Object.keys(incoming);
    const overlaps=dates.filter(k=>existing.has(k)).length;
    if(!confirm(`Импортировать ${dates.length} дней?\nСовпадающие даты будут заменены: ${overlaps}.\nОстальные текущие даты сохранятся.\n\nПродолжить?`))return;
    const merged=Object.assign(Object.create(null),current,incoming);
    const serialized=JSON.stringify(merged);
    try{localStorage.setItem(STORE,serialized)}catch{throw Error('Не удалось сохранить импорт. Проверьте свободное место в браузере.');}
    state.days=merged;
    render();
    alert(`Импорт завершён. Добавлено дней: ${dates.length-overlaps}; заменено: ${overlaps}.`);
  }catch(e){alert('Импорт отменён: '+(e instanceof SyntaxError?'неверный формат JSON.':e.message))}
}
function backupControls(){return `<div class="card"><div class="title">Резервная копия</div><div class="small" style="margin-bottom:12px">Скачайте все записи в JSON-файл или восстановите их из ранее сохранённой копии. Совпадающие даты при импорте заменяются, остальные сохраняются.</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="action" onclick="exportBackup()">Скачать копию</button><label class="action" style="cursor:pointer">Восстановить из файла<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></label></div><div class="small" style="margin-top:12px">Файл храните в надёжном месте. Синхронизация между устройствами пока не автоматическая.</div></div>`}

// Функции отображения отделены от описаний разделов. Добавление разделов позже
// потребует регистрации нового обработчика, но не изменения логики навигации.
const sectionRenderers={today,sport,food,habits,history};
const views=Object.fromEntries([...SECTION_CATALOG].sort((a,b)=>a.order-b.order).map(section=>[section.id,[section.title,section.icon,sectionRenderers[section.id]]]));
function render(){const current=dateKey(new Date());document.querySelector('.date').textContent=(state.selected===current?'Сегодня · ':'Просмотр · ')+parseDay(state.selected).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});main.innerHTML=(state.selected!==current?`<div class="card day"><span class="small">Просмотр без редактирования · ${escapeHtml(state.selected)}</span><button class="action" onclick="selectDay('${current}')">К сегодня</button></div>`:'')+views[state.tab][2]();tabs.innerHTML=Object.entries(views).map(([k,v])=>`<button class="${state.tab===k?'active':''}" onclick="navigate('${k}')"><span class="icon">${v[1]}</span>${v[0]}</button>`).join('')}
render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncDay()});window.addEventListener('focus',syncDay);setInterval(syncDay,60000);

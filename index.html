<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой ритм — прототип</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#f5f5f2;--card:#fff;--text:#20211f;--muted:#777;--line:#e4e4df;--accent:#2f6f57;--soft:#e9f1ed}
@media(prefers-color-scheme:dark){:root{--bg:#151715;--card:#202320;--text:#f1f2ef;--muted:#aaa;--line:#353935;--accent:#82c4a5;--soft:#25352d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}#app{min-height:100vh;background:var(--bg)}
header{padding:24px 18px 12px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);z-index:2}h1{font-size:28px;margin:0 0 4px} .date{color:var(--muted);font-size:14px}
main{padding:8px 16px 94px;max-width:720px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.title{font-size:18px;font-weight:700;margin-bottom:12px}.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row input{width:21px;height:21px;accent-color:var(--accent)}.small{font-size:13px;color:var(--muted)}.pill{display:inline-block;background:var(--soft);color:var(--accent);padding:6px 9px;border-radius:999px;font-size:13px;font-weight:650}.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0}.bar{height:100%;background:var(--accent);width:0%;transition:.2s}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--soft);border-radius:14px;padding:13px}.stat b{display:block;font-size:21px}.note{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text);padding:11px;font:inherit}.tabs{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:3}.tabs button{border:0;background:none;color:var(--muted);padding:10px 7px 11px;font-size:11px;flex:1;max-width:120px}.tabs button.active{color:var(--accent);font-weight:700}.icon{font-size:19px;display:block;margin-bottom:2px}.hidden{display:none}.section-note{margin-top:16px}.day{display:flex;justify-content:space-between;align-items:center}.week{display:flex;gap:6px;margin-top:12px}.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:12px}.dot.done{background:var(--accent);color:white}.action{border:0;border-radius:12px;padding:9px 12px;background:var(--soft);color:var(--accent);font-weight:650}
</style></head>
<body><div id="app"><header><h1>Мой ритм</h1><div class="date">Сегодня · понедельник</div></header><main id="main"></main><nav class="tabs" id="tabs"></nav></div>
<script>
const STORE='my-rhythm-days-v1';
const state={tab:'today',selected:dateKey(new Date()),days:loadDays()};
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDay(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function shiftDay(k,n){const d=parseDay(k);d.setDate(d.getDate()+n);return dateKey(d)}
function loadDays(){try{const obj=JSON.parse(localStorage.getItem(STORE)||'{}');return obj&&typeof obj==='object'&&!Array.isArray(obj)?obj:{}}catch{return {}}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state.days))}catch{alert('Не удалось сохранить данные. Проверьте настройки браузера и свободное место.')}}
function record(k=state.selected){return state.days[k]||{checks:{},note:''}}
function editRecord(){return state.days[state.selected]??={checks:{},note:''}}
function doneWorkout(k){return workouts.every((_,i)=>!!record(k).checks['w'+i])}
function weekStart(k){const d=parseDay(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dateKey(d)}
function weekCount(k){let start=weekStart(k),n=0;for(let i=0;i<7;i++)if(doneWorkout(shiftDay(start,i)))n++;return n}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectDay(k){state.selected=k;render()}
function updateNote(v){editRecord().note=v;save()}
function syncDay(){const now=dateKey(new Date());if(state.selected===lastToday){state.selected=now;render()}lastToday=now}
let lastToday=dateKey(new Date());

const workouts=['Тяга на тренажёре на спину — 3 × 10–12','Жим от груди на тренажёре — 3 × 10–12','Подтягивания на низком турнике / австралийские — 3 × 5–8','Отжимания на брусьях — 3 × 6–9','Скручивания на пресс — 3 × 12–15'];
const daily=['Цигун — 25–30 минут','Шлепки под коленом — 50','Колено к локтю в сторону — 50','Приседания — 50'];
const meals=['10:00 — Завтрак','13:00 — Обед','15:00 — Перекус','18:00 — Ужин'];
function checked(k){return !!record().checks[k]} function toggle(k){const r=editRecord();r.checks[k]=!r.checks[k];save();render()}
function box(k,label){return `<label class="row"><input type="checkbox" ${checked(k)?'checked':''} onchange="toggle('${k}')"><span>${label}</span></label>`}
function note(){return `<div class="card section-note"><div class="title">Заметка дня</div><textarea class="note" placeholder="Что важно отметить сегодня?" oninput="updateNote(this.value)">${escapeHtml(record().note)}</textarea></div>`}
function progress(){let all=[...daily,...meals,'Творчество / Рисование — минимум 10 минут'];let done=all.filter((_,i)=>checked(['daily0','daily1','daily2','daily3','meal0','meal1','meal2','meal3','creative'][i])).length;return Math.round(done/all.length*100)}
function today(){let sport=weekCount(state.selected);return `<div class="card"><div class="title">Сегодня</div><div class="grid"><div class="stat"><span class="small">Спорт</span><b>${sport}/3</b><span class="small">тренировок за неделю</span></div><div class="stat"><span class="small">Питание</span><b>${[0,1,2,3].filter(i=>checked('meal'+i)).length}/4</b><span class="small">приёмов пищи</span></div><div class="stat"><span class="small">Привычка</span><b>${checked('creative')?'✓':'—'}</b><span class="small">рисование</span></div><div class="stat"><span class="small">Общий ориентир</span><b>${progress()}%</b><span class="small">без гонки за 100%</span></div></div><div class="progress"><div class="bar" style="width:${progress()}%"></div></div></div><div class="card"><div class="title">Сегодня достаточно</div><div class="small">Не обязательно закрывать всё. Главное — удерживать ритм и возвращаться к нему.</div></div>${note()}`}
function sport(){return `<div class="card"><div class="day"><div><div class="title">Основная тренировка</div><div class="small">3 раза в неделю · 25–30 минут</div></div><span class="pill">${workouts.filter((_,i)=>checked('w'+i)).length}/5</span></div>${workouts.map((x,i)=>box('w'+i,x)).join('')}</div><div class="card"><div class="title">Ежедневно</div>${box('daily0',daily[0])}</div><div class="card"><div class="title">Короткий блок</div>${daily.slice(1).map((x,i)=>box('daily'+(i+1),x)).join('')}</div>${note()}`}
function food(){return `<div class="card"><div class="title">Питание</div>${meals.map((x,i)=>box('meal'+i,x)).join('')}</div><div class="card"><div class="title">Осознанность</div>${box('mindful','Есть осознанно')}</div><div class="card"><div class="title">Принцип</div><div class="small">Регулярность важнее идеальности. Минимум 3 часа между приёмами пищи.</div></div>${note()}`}
function habits(){return `<div class="card"><div class="title">Привычки</div>${box('creative','Творчество / Рисование — минимум 10 минут')}</div>${note()}`}
function history(){const start=weekStart(state.selected),days=Array.from({length:7},(_,i)=>shiftDay(start,i));const count=weekCount(state.selected);const all=Object.keys(state.days).sort().reverse().filter(k=>k<=dateKey(new Date()));return `<div class="card"><div class="title">Неделя · ${escapeHtml(start)}</div><div class="week" style="justify-content:space-between">${days.map(k=>`<div style="text-align:center"><button class="dot ${doneWorkout(k)?'done':''}" style="border:0;cursor:pointer;outline:${state.selected===k?'2px solid var(--accent)':'none'}" onclick="selectDay('${k}')">${doneWorkout(k)?'✓':parseDay(k).getDate()}</button><div class="small" style="margin-top:4px">${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][parseDay(k).getDay()]}</div></div>`).join('')}</div></div><div class="card"><div class="title">Спорт за неделю</div><div class="day"><span>Основных тренировок</span><b>${count}/3</b></div><div class="progress"><div class="bar" style="width:${Math.min(100,count/3*100)}%"></div></div></div><div class="card"><div class="title">Сохранённые дни</div>${all.length?all.map(k=>`<div class="row"><button class="action" onclick="selectDay('${k}')">${k===state.selected?'✓ ':''}${escapeHtml(k)}</button><span class="small">${doneWorkout(k)?'Тренировка · ':''}${Object.values(record(k).checks).filter(Boolean).length} отметок${record(k).note?' · заметка':''}</span></div>`).join(''):'<div class="small">Пока нет записей</div>'}</div>${note()}${backupControls()}`}


const BACKUP_FORMAT='my-rhythm-backup';
const BACKUP_VERSION=1;
const MAX_BACKUP_BYTES=5*1024*1024;
const CHECK_KEYS=new Set(['w0','w1','w2','w3','w4','daily0','daily1','daily2','daily3','meal0','meal1','meal2','meal3','mindful','creative']);
function validDateKey(k){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return false;
  const d=parseDay(k);
  return !Number.isNaN(d.getTime())&&dateKey(d)===k;
}
function validatedDays(value){
  if(!value||typeof value!=='object'||Array.isArray(value))throw Error('Некорректный список дней.');
  const cleaned=Object.create(null);
  const entries=Object.entries(value);
  if(entries.length>20000)throw Error('Слишком много записей.');
  for(const [date,entry] of entries){
    if(!validDateKey(date)||!entry||typeof entry!=='object'||Array.isArray(entry))throw Error('Некорректная дата или запись.');
    if(typeof entry.note!=='string'||entry.note.length>100000||!entry.checks||typeof entry.checks!=='object'||Array.isArray(entry.checks))throw Error('Некорректные данные дня '+date);
    const checks={};
    for(const [key,val] of Object.entries(entry.checks)){
      if(!CHECK_KEYS.has(key)||typeof val!=='boolean')throw Error('Некорректная отметка за '+date);
      checks[key]=val;
    }
    cleaned[date]={checks,note:entry.note};
  }
  return cleaned;
}
function exportBackup(){
  try{
    const days=validatedDays(state.days);
    const payload={format:BACKUP_FORMAT,version:BACKUP_VERSION,exportedAt:new Date().toISOString(),days};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='my-rhythm-backup-'+dateKey(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
  }catch(e){alert('Не удалось создать резервную копию: '+e.message)}
}
async function importBackup(input){
  const file=input.files&&input.files[0];input.value='';
  if(!file)return;
  try{
    if(file.size>MAX_BACKUP_BYTES)throw Error('Файл больше 5 МБ.');
    const payload=JSON.parse(await file.text());
    if(!payload||payload.format!==BACKUP_FORMAT||payload.version!==BACKUP_VERSION)throw Error('Это не резервная копия My Rhythm поддерживаемой версии.');
    const incoming=validatedDays(payload.days);
    const current=validatedDays(state.days);
    const existing=new Set(Object.keys(current));
    const dates=Object.keys(incoming);
    const overlaps=dates.filter(k=>existing.has(k)).length;
    if(!confirm(`Импортировать ${dates.length} дней?\nСовпадающие даты будут заменены: ${overlaps}.\nОстальные текущие даты сохранятся.\n\nПродолжить?`))return;
    const merged=Object.assign(Object.create(null),current,incoming);
    const serialized=JSON.stringify(merged);
    try{localStorage.setItem(STORE,serialized)}catch{throw Error('Не удалось сохранить импорт. Проверьте свободное место в браузере.');}
    state.days=merged;
    render();
    alert(`Импорт завершён. Добавлено дней: ${dates.length-overlaps}; заменено: ${overlaps}.`);
  }catch(e){alert('Импорт отменён: '+(e instanceof SyntaxError?'неверный формат JSON.':e.message))}
}
function backupControls(){return `<div class="card"><div class="title">Резервная копия</div><div class="small" style="margin-bottom:12px">Скачайте все записи в JSON-файл или восстановите их из ранее сохранённой копии. Совпадающие даты при импорте заменяются, остальные сохраняются.</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="action" onclick="exportBackup()">Скачать копию</button><label class="action" style="cursor:pointer">Восстановить из файла<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></label></div><div class="small" style="margin-top:12px">Файл храните в надёжном месте. Синхронизация между устройствами пока не автоматическая.</div></div>`}

const views={today:['Сегодня','◷',today],sport:['Спорт','♢',sport],food:['Питание','⌁',food],habits:['Привычки','✓',habits],history:['История','↻',history]};
function render(){const current=dateKey(new Date());document.querySelector('.date').textContent=(state.selected===current?'Сегодня · ':'Просмотр · ')+parseDay(state.selected).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});main.innerHTML=(state.selected!==current?`<div class="card day"><span class="small">Запись за ${escapeHtml(state.selected)}</span><button class="action" onclick="selectDay('${current}')">К сегодня</button></div>`:'')+views[state.tab][2]();tabs.innerHTML=Object.entries(views).map(([k,v])=>`<button class="${state.tab===k?'active':''}" onclick="state.tab='${k}';render()"><span class="icon">${v[1]}</span>${v[0]}</button>`).join('')}
render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncDay()});window.addEventListener('focus',syncDay);setInterval(syncDay,60000);
</script></body></html>
